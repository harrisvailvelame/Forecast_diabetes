name: repository-quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate notebook JSON
        run: python -m json.tool diabetes_risk_classification.ipynb > /dev/null
      - name: Validate dataset contract
        run: |
          python - <<'PY'
          import csv
          expected = {'Pregnancies','Glucose','BloodPressure','SkinThickness','Insulin','BMI','DiabetesPedigreeFunction','Age','Outcome'}
          with open('diabetes.csv', newline='', encoding='utf-8') as f:
              header = set(next(csv.reader(f)))
          missing = expected - header
          if missing:
              raise SystemExit(f'Missing columns: {sorted(missing)}')
          PY
